<!DOCTYPE html>
<html lang="nl">
<head>
    
    <script src="/js/auth-guard-inline.js"></script>
    <script src="/js/maintenance-check.js"></script>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulance | Kennistoetsen</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <script src="/js/auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0c10; font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; color: #eef2ff; line-height: 1.5; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 40%, #0f172a 0%, #0a0c10 100%); z-index: -2; }
        .header { background: rgba(10, 12, 18, 0.95); backdrop-filter: blur(12px); border-bottom: 2px solid #ff3333; padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo i { font-size: 2rem; color: #ff3333; }
        .logo h1 { font-size: 1.4rem; font-weight: 700; }
        .logo span { color: #ff3333; }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid #2a2c35; padding: 0.5rem 1.2rem; border-radius: 30px; color: #ccc; cursor: pointer; text-decoration: none; }
        .back-btn:hover { background: rgba(255,51,51,0.2); border-color: #ff3333; color: #ff3333; } .logout-btn{background:rgba(255,255,255,0.05);border:1px solid #2a2c35;padding:0.5rem 1.2rem;border-radius:30px;color:#ccc;cursor:pointer;font-size:0.9rem;} .logout-btn:hover{border-color:#ff3333;color:#ff6666;}
        .hero { text-align: center; padding: 2rem 1rem; }
        .hero h2 { font-size: 2rem; margin-bottom: 0.5rem; }
        .hero h2 span { color: #ff3333; }
        .toetsen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .toets-card { background: rgba(0, 0, 0, 0.35); border-radius: 20px; padding: 1.3rem; border-left: 3px solid #ffaa33; transition: 0.2s; }
        .toets-card:hover { transform: translateY(-5px); background: rgba(255,170,51,0.1); }
        .toets-card h3 { color: #ffaa33; margin-bottom: 0.5rem; }
        .toets-card .rang { display: inline-block; background: #ff333320; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; margin: 0.5rem 0; }
        .btn-toets { background: #ffaa33; color: #0a0c10; padding: 0.6rem 1rem; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; margin-top: 1rem; width: 100%; transition: 0.2s; }
        .btn-toets:hover { background: #ffcc66; }
        .score-badge { background: #00ff8820; color: #00ff88; padding: 0.2rem 0.7rem; border-radius: 20px; font-size: 0.7rem; display: inline-block; margin-top: 0.5rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #141824; border-radius: 24px; padding: 2rem; max-width: 700px; width: 90%; max-height: 85vh; overflow-y: auto; border: 1px solid #ffaa33; }
        .quiz-vraag { margin-bottom: 1.5rem; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 16px; }
        .quiz-vraag p { font-weight: 600; margin-bottom: 0.8rem; }
        .quiz-optie { display: block; margin: 0.5rem 0; padding: 0.5rem; background: rgba(255,255,255,0.05); border-radius: 12px; cursor: pointer; }
        .quiz-optie:hover { background: rgba(255,51,51,0.2); }
        .quiz-optie input { margin-right: 0.8rem; }
        .btn-submit { background: #ff3333; color: white; border: none; padding: 0.8rem; border-radius: 30px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 1rem; }
        .close-modal { background: #ff3333; color: white; border: none; padding: 0.5rem 1rem; border-radius: 30px; cursor: pointer; margin-top: 1rem; width: 100%; }
        .resultaat { text-align: center; padding: 1.5rem; background: rgba(255,51,51,0.2); border-radius: 16px; margin-top: 1rem; }
        .certificaat-download { display: inline-block; background: #00ff88; color: #0a0c10; padding: 0.8rem 1.5rem; border-radius: 30px; text-decoration: none; font-weight: 600; margin-top: 1rem; border: none; cursor: pointer; }
        footer { background: #06080c; text-align: center; padding: 2rem; margin-top: 3rem; border-top: 1px solid #ff333330; font-size: 0.8rem; color: #6b7280; }
        @media (max-width: 768px) { .toetsen-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="bg"></div>

<header class="header">
    <div class="container">
        <div class="nav-flex">
            <div class="logo"><i class="fas fa-clipboard-list"></i><h1>Ambulance | <span>Kennistoetsen</span></h1></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;"><a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Terug naar Dashboard</a><button type="button" class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Uitloggen</button></div>
        </div>
    </div>
</header>

<main class="container">
    <div class="hero">
        <h2>Kennistoetsen</h2>
        <p><i class="fas fa-clipboard-list"></i> Toets je kennis per training | 80% = Certificaat</p>
    </div>
    <div class="toetsen-grid" id="toetsenGrid"></div>
</main>

<footer>
    <p>© 2026 Overheid Portaal | Ambulance Divisie</p>
</footer>

<div id="quizModal" class="modal"><div class="modal-content"><h3 id="quizTitle"></h3><div id="quizQuestions"></div></div></div>

<script src="/js/certificaat-download.js"></script>
<script>
    const toetsen = [
        { id: "basis", training: "Basisopleiding", rang: "Chauffeur / Aspirant", beschrijving: "Porto, statussen, prio’s en veiligheid op scene",
          vragen: [
              { vraag: "Wat betekent Status 7 op de porto?", opties: ["Ter plaatse", "Spoed spraak (direct spreken)", "Uit dienst", "Transport naar ziekenhuis"], antwoord: 1 },
              { vraag: "Wanneer gebruik je Prio 1?", opties: ["Bij routinevervoer", "Bij levensbedreigende spoed", "Altijd", "Nooit met sirenes"], antwoord: 1 },
              { vraag: "Wat is je eerste taak bij aankomst op een ongeval?", opties: ["Patiënt fouilleren", "Veiligheid scene + eigen veiligheid", "Direct reanimeren zonder kijken", "Wegrijden"], antwoord: 1 },
              { vraag: "Mag jij als ambulance iemand arresteren?", opties: ["Ja, bij verdenking", "Nee, dat is politie/KMar", "Alleen met wapen", "Alleen op ziekenhuis"], antwoord: 1 },
              { vraag: "Wat meld je bij vertrek naar melding?", opties: ["Status 10", "Aanrijden + locatie", "Uit dienst", "Niets"], antwoord: 1 }
          ] },
        { id: "rijspoed", training: "Rijopleiding spoed", rang: "Verpleegkundige", beschrijving: "Prio-ritten, sirenes en veilig transport",
          vragen: [
              { vraag: "Bij spoedrit (Prio 1) gebruik je:", opties: ["Alleen lampen", "Lampen en sirenes", "Geen signalen", "Claxon alleen"], antwoord: 1 },
              { vraag: "Wat gaat voor bij een spoedrit?", opties: ["Snelheid om elke prijs", "Veiligheid burgers en verkeer", "Achtervolging", "Parkeren op rijbaan"], antwoord: 1 },
              { vraag: "Wat meld je bij aankomst ziekenhuis?", opties: ["Status 0", "Ter plaatse ziekenhuis / overdracht", "Uit dienst", "Prio 3"], antwoord: 1 }
          ] },
        { id: "reanimatie", training: "Reanimatie & AED", rang: "Verpleegkundige", beschrijving: "BLS, AED en teamreanimatie",
          vragen: [
              { vraag: "Wat check je eerst bij een bewusteloze?", opties: ["Portemonnee", "Ademhaling en bewustzijn", "Kenteken", "Handboeien"], antwoord: 1 },
              { vraag: "Hoe vaak per minuut borstcompressies (volwassene)?", opties: ["60-80", "100-120", "200", "30"], antwoord: 1 },
              { vraag: "Wat doe je bij AED: 'schok adviseren'?", opties: ["Niets", "Iedereen weg van patiënt, schokken", "Water geven", "Patiënt optillen"], antwoord: 1 },
              { vraag: "Bewusteloos en ademt wel — dan:", opties: ["Stabiele zijligging", "Direct schokken", "Lat staan op buik", "Rechts slaan"], antwoord: 0 }
          ] },
        { id: "trauma", training: "Trauma & letsel", rang: "MMT / Specialist", beschrijving: "Assessment, bloedverlies en immobilisatie",
          vragen: [
              { vraag: "Wat is START triage in het kort?", opties: ["Wapenprotocol", "Snel prioriteren slachtoffers", "Rijtraining", "Porto-discipline"], antwoord: 1 },
              { vraag: "Bij ernstig bloedverlies uit arm, eerste stap:", opties: ["Direct infuus zonder druk", "Drukverband / druk op wond", "Patiënt laten lopen", "Fouilleren"], antwoord: 1 },
              { vraag: "Verdenking nekletsel — je doet:", opties: ["Hoofd vrij bewegen", "Nek immobiliseren, voorzichtig verplaatsen", "Reanimeren staand", "Wegrijden"], antwoord: 1 }
          ] },
        { id: "mmt", training: "MMT / Rapid Responder", rang: "MMT", beschrijving: "Snelle interventie en geavanceerde stabilisatie",
          vragen: [
              { vraag: "Wat is het doel van MMT?", opties: ["Achtervolging", "Snelle medische stabilisatie op scene", "Arrestaties", "Boetes uitdelen"], antwoord: 1 },
              { vraag: "Bij schietpartij zonder vrijgave politie:", opties: ["Direct naar slachtoffer rennen", "Wachten op veilige scene", "Wapen pakken", "Weglopen zonder melding"], antwoord: 1 },
              { vraag: "Overdracht aan ziekenhuis RP:", opties: ["Geen info geven", "Kort: letsel, behandeling, tijd", "Alleen naam", "Alleen porto uit"], antwoord: 1 }
          ] },
        { id: "ovdg", training: "Coördinatie & GGB", rang: "OvD-G / Leiding", beschrijving: "Meerdere slachtoffers en inzet voertuigen",
          vragen: [
              { vraag: "Rol OvD-G bij groot ongeval:", opties: ["Alleen rijden", "Coördineren ambulance-inzet", "Politie leiden", "Wetboek schrijven"], antwoord: 1 },
              { vraag: "Meer slachtoffers dan voertuigen — eerst:", opties: ["Willekeurig helpen", "Triage en prioriteit bepalen", "Iedereen naar zelfde ziekenhuis zonder overleg", "Stoppen"], antwoord: 1 },
              { vraag: "Communicatie met meldkamer:", opties: ["Geen updates", "Aantal slachtoffers, status, extra eenheden", "Alleen privé", "Alleen Discord"], antwoord: 1 }
          ] },
        { id: "lifeliner", training: "Lifeliner / Helikopter", rang: "OvD-G / Specialist", beschrijving: "Luchttransport en landingzone",
          vragen: [
              { vraag: "Landingzone voor helikopter moet:", opties: ["Vol staan met auto's", "Vrij, veilig en groot genoeg zijn", "In tunnel", "Op snelweg zonder afzetting"], antwoord: 1 },
              { vraag: "Overdracht luchtambulance:", opties: ["Geen overleg", "Duidelijke overdracht vitale gegevens", "Alleen porto uit", "Patiënt alleen laten"], antwoord: 1 },
              { vraag: "Helikopter bij gevaarlijke scene:", opties: ["Altijd direct landen", "Alleen na veilige afzetting/coördinatie", "Niet communiceren", "Zelf landen zonder melding"], antwoord: 1 }
          ] },
        { id: "medicatie", training: "Medicatie (beperkt)", rang: "Met certificaat", beschrijving: "Alleen na training en goedkeuring",
          vragen: [
              { vraag: "Medicatie toedienen mag als:", opties: ["Iedereen dat wil", "Je certificaat/training en protocol hebt", "Patiënt het vraagt", "Politie het zegt"], antwoord: 1 },
              { vraag: "Geen certificaat medicatie — dan:", opties: ["Toch geven", "Niet toedienen, stabiliseren en overleg", "Dubbele dosis", "Verkopen"], antwoord: 1 },
              { vraag: "Allergie onbekend bij medicatie:", opties: ["Gokken", "Voorzichtig, overleg leiding, protocol volgen", "Niet vragen", "Alles geven"], antwoord: 1 }
          ] },
        { id: "ehbo", training: "EHBO / Eerste hulp", rang: "Alle functies", beschrijving: "Basis stabilisatie en wondverzorging",
          vragen: [
              { vraag: "Eerste stap bij slachtoffer?", opties: ["Veiligheid + aanspreken", "Direct weg", "Fouilleren", "Foto maken"], antwoord: 0 },
              { vraag: "Diepe borstcompressies ongeveer:", opties: ["1 cm", "5-6 cm", "20 cm", "Niet masseren"], antwoord: 1 },
              { vraag: "Ernstige bloeding — helpend:", opties: ["Druk op wond", "Water drinken geven", "Patiënt rennen laten", "Niets doen"], antwoord: 0 },
              { vraag: "Privacy patiënt RP:", opties: ["Alles in global chat", "Beperk info tot noodzakelijk", "ID op Twitter", "Live streamen"], antwoord: 1 }
          ] }
    ];

    let scores = JSON.parse(localStorage.getItem('AmbulanceToetsScores') || '{}');
    let actieveToets = null;

    function saveScore(toetsId, score, maxScore) {
        scores[toetsId] = { score: score, max: maxScore, datum: new Date().toISOString() };
        localStorage.setItem('AmbulanceToetsScores', JSON.stringify(scores));
        loadToetsen();
    }

    function loadToetsen() {
        const container = document.getElementById('toetsenGrid');
        container.innerHTML = toetsen.map(toets => {
            const score = scores[toets.id];
            const isGeslaagd = score && (score.score / score.max >= 0.8);
            return `<div class="toets-card"><i class="fas fa-clipboard-list" style="color:#ffaa33; font-size:1.8rem;"></i>
                <h3>${toets.training}</h3><div class="rang"><i class="fas fa-tag"></i> ${toets.rang}</div>
                <p style="font-size:0.8rem;">${toets.beschrijving}</p>
                <div>${score ? `<span class="score-badge">✅ Score: ${score.score}/${score.max}</span>` : `<span class="score-badge" style="background:#ffaa3320; color:#ffaa33;">⏳ Nog niet gemaakt</span>`}
                ${isGeslaagd ? `<span class="score-badge" style="background:#ff333320; color:#ff3333;">📜 Certificaat</span>` : ''}</div>
                <button class="btn-toets" onclick="openToets('${toets.id}')">${score ? '🔄 Opnieuw proberen' : '▶ Start Toets'}</button></div>`;
        }).join('');
    }

    function openToets(toetsId) {
        actieveToets = toetsen.find(t => t.id === toetsId);
        document.getElementById('quizTitle').innerHTML = `<i class="fas fa-clipboard-list"></i> ${actieveToets.training} - Kennistoets`;
        let html = '';
        actieveToets.vragen.forEach((vraag, idx) => {
            html += `<div class="quiz-vraag"><p><strong>${idx+1}. ${vraag.vraag}</strong></p>${vraag.opties.map((optie, optIdx) => `<label class="quiz-optie"><input type="radio" name="q${idx}" value="${optIdx}"> ${optie}</label>`).join('')}</div>`;
        });
        html += `<button class="btn-submit" onclick="submitQuiz()">Verzenden</button><button class="close-modal" onclick="closeQuizModal()">Sluiten</button>`;
        document.getElementById('quizQuestions').innerHTML = html;
        document.getElementById('quizModal').style.display = 'flex';
    }

    function submitQuiz() {
        let score = 0;
        actieveToets.vragen.forEach((vraag, idx) => {
            const selected = document.querySelector(`input[name="q${idx}"]:checked`);
            if (selected && parseInt(selected.value) === vraag.antwoord) score++;
        });
        const maxScore = actieveToets.vragen.length;
        const percentage = Math.round(score / maxScore * 100);
        saveScore(actieveToets.id, score, maxScore);
        let resultHtml = `<div class="resultaat"><h3>Jouw score: ${score}/${maxScore} (${percentage}%)</h3>`;
        if (percentage >= 80) resultHtml += `<p style="color:#00ff88;"><i class="fas fa-certificate"></i> Gefeliciteerd! Je bent geslaagd!</p><button class="certificaat-download" onclick="downloadCertificaat('${actieveToets.training}', ${score}, ${maxScore})"><i class="fas fa-download"></i> Download certificaat</button>`;
        else resultHtml += `<p style="color:#ffaa33;"><i class="fas fa-book-open"></i> Helaas niet geslaagd. Probeer opnieuw.</p><button class="btn-submit" onclick="closeQuizModal()">Sluiten</button>`;
        resultHtml += `</div>`;
        document.getElementById('quizQuestions').innerHTML = resultHtml;
    }

    function downloadCertificaat(training, score, maxScore) {
        downloadOverheidCertificaat({
            training, score, maxScore,
            kleur: '#ff3333',
            dienst: 'Ambulance',
            handtekening: 'Leiding URP Ambulance',
            defaultUser: 'Ambulancemedewerker'
        });
    }

    function closeQuizModal() { document.getElementById('quizModal').style.display = 'none'; actieveToets = null; loadToetsen(); }
    loadToetsen();
</script>
<script>requireAuth('ambulance');</script>
</body>
</html>
