<!DOCTYPE html>
<html lang="nl">
<head>
    
    <script src="/js/auth-guard-inline.js"></script>
    <script src="/js/maintenance-check.js"></script>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulance | Handboeken</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <script src="/js/auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0c10; font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; color: #eef2ff; line-height: 1.5; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 40%, #0f172a 0%, #0a0c10 100%); z-index: -2; }
        .header { background: rgba(10, 12, 18, 0.95); backdrop-filter: blur(12px); border-bottom: 2px solid #ff3333; padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo i { font-size: 2rem; color: #ff3333; }
        .logo h1 { font-size: 1.4rem; font-weight: 700; }
        .logo span { color: #ff3333; }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid #2a2c35; padding: 0.5rem 1.2rem; border-radius: 30px; color: #ccc; cursor: pointer; text-decoration: none; }
        .back-btn:hover { background: rgba(255,51,51,0.2); border-color: #ff3333; color: #ff3333; } .logout-btn{background:rgba(255,255,255,0.05);border:1px solid #2a2c35;padding:0.5rem 1.2rem;border-radius:30px;color:#ccc;cursor:pointer;font-size:0.9rem;} .logout-btn:hover{border-color:#ff3333;color:#ff6666;}
        .hero { text-align: center; padding: 2rem 1rem; }
        .hero h2 { font-size: 2rem; margin-bottom: 0.5rem; }
        .hero h2 span { color: #ff3333; }
        .pdf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .pdf-card { background: rgba(0, 0, 0, 0.35); border-radius: 16px; padding: 1.2rem; text-decoration: none; color: white; display: flex; align-items: center; gap: 1rem; transition: 0.2s; border: 1px solid rgba(255,255,255,0.05); }
        .pdf-card:hover { transform: translateY(-3px); border-color: #ff3333; background: rgba(255,51,51,0.1); }
        .pdf-card i { font-size: 2rem; color: #ff3333; }
        .pdf-card h3 { font-size: 1rem; margin-bottom: 0.3rem; }
        .pdf-card p { font-size: 0.7rem; color: #9ca3af; }
        footer { background: #06080c; text-align: center; padding: 2rem; margin-top: 3rem; border-top: 1px solid #ff333330; font-size: 0.8rem; color: #6b7280; }
        @media (max-width: 768px) { .nav-flex { flex-direction: column; text-align: center; } .pdf-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="bg"></div>

<header class="header">
    <div class="container">
        <div class="nav-flex">
            <div class="logo"><i class="fas fa-file-pdf"></i><h1>Ambulance | <span>Handboeken</span></h1></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;"><a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Terug naar Dashboard</a><button type="button" class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Uitloggen</button></div>
        </div>
    </div>
</header>

<main class="container">
    <div class="hero">
        <h2>Ambulance <span>Handboeken</span></h2>
        <p><i class="fas fa-file-pdf"></i> Alle training handleidingen als PDF</p>
    </div>
    
    <div class="pdf-grid" id="pdfGrid"></div>
</main>

<footer>
    <p>© 2026 Overheid Portaal | Ambulance Divisie</p>
</footer>

<script>
    // De lijst met PDF bestanden - Zet hier de namen van jouw PDF bestanden!
    const pdfBestanden = [
        { bestand: "01-basisopleiding.pdf", naam: "Basisopleiding Ambulance", icoon: "fa-book-medical", beschrijving: "Porto, statussen, prio’s, patiëntcontact & veiligheid" },
        { bestand: "02-rijopleiding-spoed.pdf", naam: "Rijopleiding spoed", icoon: "fa-ambulance", beschrijving: "Prio-ritten, sirenes, routes ziekenhuis" },
        { bestand: "03-reanimatie-aed.pdf", naam: "Reanimatie & AED", icoon: "fa-heart-pulse", beschrijving: "BLS, AED, borstcompressies & teamrol" },
        { bestand: "04-trauma-stabilisatie.pdf", naam: "Trauma & stabilisatie", icoon: "fa-user-injured", beschrijving: "Letsel, immobilisatie, bloedverlies" },
        { bestand: "05-mmt-rapid.pdf", naam: "MMT / Rapid Responder", icoon: "fa-truck-medical", beschrijving: "Snelle interventie op scene" },
        { bestand: "06-ovdg-ggb.pdf", naam: "OvD-G & GGB", icoon: "fa-users", beschrijving: "Coördinatie bij meerdere slachtoffers" },
        { bestand: "07-lifeliner.pdf", naam: "Lifeliner / Helikopter", icoon: "fa-helicopter", beschrijving: "LZ, overdracht luchtambulance" },
        { bestand: "08-medicatie.pdf", naam: "Medicatie (beperkt)", icoon: "fa-syringe", beschrijving: "Alleen met certificaat & protocol" },
        { bestand: "09-ehbo.pdf", naam: "EHBO / Eerste hulp", icoon: "fa-heartbeat", beschrijving: "Basis zorg, verband, stabilisatie" },
        { bestand: "10-samenwerking.pdf", naam: "Samenwerking hulpdiensten", icoon: "fa-handshake", beschrijving: "Politie, brandweer, meldkamer" }
    ];

    const container = document.getElementById('pdfGrid');
    
    pdfBestanden.forEach(pdf => {
        const pdfLink = `pdf/${pdf.bestand}`;
        container.innerHTML += `
            <a href="${pdfLink}" target="_blank" class="pdf-card">
                <i class="fas ${pdf.icoon}"></i>
                <div>
                    <h3>${pdf.naam}</h3>
                    <p>${pdf.beschrijving}</p>
                    <p style="font-size:0.65rem; color:#ff3333; margin-top:0.3rem;"><i class="fas fa-file-pdf"></i> Download PDF →</p>
                </div>
            </a>
        `;
    });
</script>
<script>requireAuth('ambulance');</script>
</body>
</html>
