<!DOCTYPE html>
<html lang="nl">
<head>
    <script src="/js/auth-guard-inline.js"></script>
    <script src="/js/maintenance-check.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulance | Wetboek</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <script src="/js/auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0c10; font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; color: #eef2ff; line-height: 1.5; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 40%, #0f172a 0%, #0a0c10 100%); z-index: -2; }
        .header { background: rgba(10, 12, 18, 0.95); backdrop-filter: blur(12px); border-bottom: 2px solid #ff3333; padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 2rem; }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo i { font-size: 2rem; color: #ff3333; }
        .logo h1 { font-size: 1.4rem; font-weight: 700; }
        .logo span { color: #ff3333; }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid #2a2c35; padding: 0.5rem 1.2rem; border-radius: 30px; color: #ccc; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .back-btn:hover { background: rgba(255,51,51,0.2); border-color: #ff3333; color: #ff3333; }
        .logout-btn { background: rgba(255,255,255,0.05); border: 1px solid #2a2c35; padding: 0.5rem 1.2rem; border-radius: 30px; color: #ccc; cursor: pointer; font-size: 0.9rem; }
        .logout-btn:hover { border-color: #ff3333; color: #ff6666; }
        .hero { text-align: center; padding: 2rem 1rem 1rem; }
        .hero h2 { font-size: 2rem; margin-bottom: 0.5rem; }
        .hero h2 span { color: #ff3333; }
        .section { background: rgba(20, 24, 36, 0.6); border-radius: 24px; padding: 1.5rem; margin: 1.5rem 0 3rem; border: 1px solid rgba(255,51,51,0.2); }
        .doc-embed { width: 100%; height: 75vh; min-height: 500px; border: none; border-radius: 16px; background: #fff; }
        .doc-actions { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .doc-link {
            display: inline-flex; align-items: center; gap: 8px;
            background: #ff3333; color: #fff; padding: 0.7rem 1.4rem;
            border-radius: 30px; text-decoration: none; font-weight: 600; font-size: 0.9rem;
        }
        .doc-link:hover { filter: brightness(1.1); }
        .doc-hint { text-align: center; font-size: 0.75rem; color: #6b7280; margin-top: 0.8rem; }
        footer { background: #06080c; text-align: center; padding: 2rem; border-top: 1px solid #ff333330; font-size: 0.8rem; color: #6b7280; }
        @media (max-width: 768px) { .doc-embed { height: 65vh; min-height: 400px; } }
    </style>
</head>
<body>
<div class="bg"></div>

<header class="header">
    <div class="container">
        <div class="nav-flex">
            <div class="logo"><i class="fas fa-gavel"></i><h1>Ambulance | <span>Wetboek</span></h1></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Terug naar Dashboard</a>
                <button type="button" class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Uitloggen</button>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <div class="hero">
        <h2>Wetboek van <span>Strafrecht</span></h2>
        <p><i class="fas fa-gavel"></i> Officieel URP-wetboek · altijd up-to-date via Google Docs</p>
    </div>

    <div class="section">
        <iframe class="doc-embed" id="wetboekFrame" title="Wetboek van Strafrecht URP"></iframe>
        <div class="doc-actions">
            <a href="#" id="wetboekOpenLink" target="_blank" rel="noopener" class="doc-link">
                <i class="fas fa-external-link-alt"></i> Open in Google Docs
            </a>
        </div>
        <p class="doc-hint">Wijzigingen in het Google Doc worden automatisch hier getoond.</p>
    </div>
</main>

<footer>
    <p>© 2026 Overheid Portaal | Ambulance Divisie</p>
</footer>

<script src="/js/wetboek-config.js"></script>
<script>
    document.getElementById('wetboekFrame').src = URP_WETBOEK.previewUrl;
    document.getElementById('wetboekOpenLink').href = URP_WETBOEK.editUrl;
    requireAuth('Ambulance');
</script>
</body>
</html>
