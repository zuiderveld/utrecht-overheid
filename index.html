<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overheid Portaal | Inloggen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c10;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            color: #eef2ff;
            line-height: 1.5;
        }
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 40%, #0f172a 0%, #0a0c10 100%);
            z-index: -2;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(20, 24, 36, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 2.5rem;
            border: 1px solid rgba(0, 102, 255, 0.3);
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo i {
            font-size: 4rem;
            color: #0066ff;
            margin-bottom: 1rem;
        }
        .logo h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .logo span {
            color: #0066ff;
        }
        .logo p {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .btn-discord {
            background: #5865f2;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            justify-content: center;
        }
        .btn-discord:hover {
            background: #4752c4;
            transform: translateY(-2px);
        }
        .diensten {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .dienst {
            text-align: center;
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .dienst i {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 0.3rem;
        }
        .dienst.politie i { color: #0066ff; }
        .dienst.kmar i { color: #ff9900; }
        .dienst.ambulance i { color: #ff3333; }
        .dienst.pechhulp i { color: #33cc33; }
        .error {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            padding: 0.8rem;
            margin: 1rem 0;
            font-size: 0.85rem;
            color: #ff6666;
            display: none;
        }
        .loading {
            margin-top: 1rem;
            color: #9ca3af;
            display: none;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
<div class="bg"></div>

<div class="container">
    <div class="login-box">
        <div class="logo">
            <i class="fas fa-landmark"></i>
            <h1>Overheid <span>Portaal</span></h1>
            <p>Eén loket voor alle hulpdiensten</p>
        </div>
        
        <div id="errorMessage" class="error">
            <i class="fas fa-exclamation-triangle"></i> <span id="errorText"></span>
        </div>
        
        <a href="#" class="btn-discord" onclick="loginMetDiscord()">
            <i class="fab fa-discord"></i> Inloggen met Discord
        </a>
        
        <div id="loadingIndicator" class="loading">
            <i class="fas fa-spinner fa-spin"></i> Bezig met inloggen...
        </div>
        
        <div class="diensten">
            <div class="dienst politie"><i class="fas fa-shield-alt"></i> Politie</div>
            <div class="dienst kmar"><i class="fas fa-passport"></i> KMar</div>
            <div class="dienst ambulance"><i class="fas fa-ambulance"></i> Ambulance</div>
            <div class="dienst pechhulp"><i class="fas fa-wrench"></i> Pechhulp</div>
        </div>
        
        <footer>
            <i class="fas fa-lock"></i> Beveiligde overheidsomgeving
        </footer>
    </div>
</div>

<script>
    // ============================================
    // CONFIGURATIE - VUL HIER JE RENDER URL IN!
    // ============================================
    const BOT_API_URL = "https://overheid-bot.onrender.com";
    const DISCORD_CLIENT_ID = "1509476480638386206";
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const DISCORD_OAUTH_URL = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify%20guilds`;
    
    // Check of we al ingelogd zijn
    if (sessionStorage.getItem('overheidDienst')) {
        const dienst = sessionStorage.getItem('overheidDienst');
        window.location.href = `/${dienst}/index.html`;
    }
    
    // Check of er een access_token in de URL zit
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    
    if (accessToken) {
        window.history.replaceState({}, document.title, window.location.pathname);
        verwerkDiscordLogin(accessToken);
    }
    
    async function verwerkDiscordLogin(token) {
        const loadingDiv = document.getElementById('loadingIndicator');
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        
        loadingDiv.style.display = 'block';
        
        try {
            const response = await fetch(`${BOT_API_URL}/api/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accessToken: token })
            });
            
            const data = await response.json();
            
            if (data.dienst) {
                sessionStorage.setItem('overheidDienst', data.dienst);
                sessionStorage.setItem('overheidUser', data.username);
                sessionStorage.setItem('overheidIsIbtDocent', data.isIbtDocent);
                window.location.href = `/${data.dienst}/index.html`;
            } else {
                throw new Error(data.error || 'Geen geldige rol gevonden');
            }
        } catch (err) {
            errorText.innerHTML = err.message;
            errorDiv.style.display = 'block';
            loadingDiv.style.display = 'none';
        }
    }
    
    function loginMetDiscord() {
        window.location.href = DISCORD_OAUTH_URL;
    }
</script>
</body>
</html>
