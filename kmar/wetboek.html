<!DOCTYPE html>
<html lang="nl" data-accent="#ff9900">
<head>
    <script src="/js/auth-guard-inline.js"></script>
    <script src="/js/maintenance-check.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMar | Wetboek</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <script src="/js/auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/wetboek.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0c10; font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; color: #eef2ff; line-height: 1.5; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 40%, #0f172a 0%, #0a0c10 100%); z-index: -2; }
        .header { background: rgba(10, 12, 18, 0.95); backdrop-filter: blur(12px); border-bottom: 2px solid #ff9900; padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo i { font-size: 2rem; color: #ff9900; }
        .logo h1 { font-size: 1.4rem; font-weight: 700; }
        .logo span { color: #ff9900; }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid #2a2c35; padding: 0.5rem 1.2rem; border-radius: 30px; color: #ccc; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .back-btn:hover { background: rgba(255,153,0,0.2); border-color: #ff9900; color: #ff9900; }
        .logout-btn { background: rgba(255,255,255,0.05); border: 1px solid #2a2c35; padding: 0.5rem 1.2rem; border-radius: 30px; color: #ccc; cursor: pointer; font-size: 0.9rem; }
        .logout-btn:hover { border-color: #ff3333; color: #ff6666; }
        footer { background: #06080c; text-align: center; padding: 2rem; border-top: 1px solid #ff990030; font-size: 0.8rem; color: #6b7280; }
    </style>
</head>
<body>
<div class="bg"></div>

<header class="header">
    <div class="container">
        <div class="nav-flex">
            <div class="logo"><i class="fas fa-gavel"></i><h1>KMar | <span>Wetboek</span></h1></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Terug naar Dashboard</a>
                <button type="button" class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Uitloggen</button>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <div class="wetboek-hero">
        <h2>Wetboek van <span>Strafrecht</span></h2>
        <nav class="wetboek-tabs" id="wetboekTabs" aria-label="Wetboek secties"></nav>
    </div>
    <div class="wetboek-card" id="wetboekContent"></div>
</main>

<footer>
    <p>© 2026 Overheid Portaal | KMar Divisie</p>
</footer>

<script src="/js/wetboek-data.js"></script>
<script src="/js/wetboek-ui.js"></script>
<script>
    initWetboekPage();
    requireAuth('kmar');
</script>
</body>
</html>
